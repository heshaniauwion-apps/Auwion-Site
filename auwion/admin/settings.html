<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Settings — Auwion Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin-ui.css">
</head>
<body>

<div id="loadingState" class="shell-loading">Checking admin session…</div>
<div id="adminShellRoot" class="admin-layout" style="display:none;"></div>

<div id="pageContent" style="display:none;">
  <div class="page-head">
    <div>
      <h1>Website Settings</h1>
      <p>Global values shared across the site: footer contact info, tagline, and copyright text.</p>
    </div>
  </div>

  <div id="settingsResult">
    <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:13px;padding:40px 0;text-align:center;">Loading settings…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/admin-client.js"></script>
<script src="assets/admin-ui.js"></script>
<script>
  (async function () {
    const admin = await initAdminShell('settings');
    if (!admin) return;
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('adminShellRoot').style.display = 'flex';
    loadSettings();
  })();

  async function loadSettings() {
    const container = document.getElementById('settingsResult');
    try {
      const { data, error } = await adminSupabase
        .from('site_settings')
        .select('key, value, updated_at')
        .order('key', { ascending: true });

      if (error) throw error;

      if (!data || data.length === 0) {
        container.innerHTML = renderStateBlock({
          icon: 'settings',
          title: 'No settings configured yet',
          description: 'Editing footer contact info (phone, email, address, LinkedIn), tagline, and copyright text is coming in the next step.',
        });
        return;
      }

      const rows = data.map(function (s) {
        return '<tr><td><code>' + escapeHtml(s.key) + '</code></td><td>' + escapeHtml(s.value) + '</td><td>' + formatDate(s.updated_at) + '</td></tr>';
      }).join('');

      container.innerHTML =
        '<div class="ac-table-wrap"><div class="table-scroll"><table class="ac-table">' +
        '<thead><tr><th>Key</th><th>Value</th><th>Updated</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div></div>';
    } catch (err) {
      container.innerHTML = renderErrorBanner('Could not load settings: ' + (err && err.message ? err.message : 'unknown error'));
    }
  }
</script>
</body>
</html>
