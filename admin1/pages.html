<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pages — Auwion Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin-ui.css">
</head>
<body>

<div id="loadingState" class="shell-loading">Checking admin session…</div>
<div id="adminShellRoot" class="admin-layout" style="display:none;"></div>

<div id="pageContent" style="display:none;">
  <div class="page-head">
    <div>
      <h1>Pages</h1>
      <p>Editable hero text and content for your site's static pages (Home, About, service pages, and more).</p>
    </div>
    <button class="btn btn-primary" disabled title="Coming soon">+ Add page</button>
  </div>

  <div id="pagesResult">
    <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:13px;padding:40px 0;text-align:center;">Loading pages…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/admin-client.js"></script>
<script src="assets/admin-ui.js"></script>
<script>
  (async function () {
    const admin = await initAdminShell('pages');
    if (!admin) return;
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('adminShellRoot').style.display = 'flex';
    loadPages();
  })();

  async function loadPages() {
    const container = document.getElementById('pagesResult');
    try {
      const { data, error } = await adminSupabase
        .from('pages')
        .select('id, slug, title, status, updated_at')
        .order('title', { ascending: true });

      if (error) throw error;

      if (!data || data.length === 0) {
        container.innerHTML = renderStateBlock({
          icon: 'pages',
          title: 'No pages yet',
          description: 'Page content management (editing Home, About, Business Central, Zoho Books, Odoo, Web Development, Book Keeping, Privacy Policy, and Terms) is coming in the next step.',
        });
        return;
      }

      const rows = data.map(function (p) {
        const badge = p.status === 'published' ? 'badge-published' : 'badge-draft';
        return '<tr class="clickable"><td>' + escapeHtml(p.title) + '</td><td><code>' + escapeHtml(p.slug) + '</code></td>' +
          '<td><span class="badge ' + badge + '">' + escapeHtml(p.status) + '</span></td><td>' + formatDate(p.updated_at) + '</td></tr>';
      }).join('');

      container.innerHTML =
        '<div class="ac-table-wrap"><div class="table-scroll"><table class="ac-table">' +
        '<thead><tr><th>Title</th><th>Slug</th><th>Status</th><th>Updated</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div></div>';
    } catch (err) {
      container.innerHTML = renderErrorBanner('Could not load pages: ' + (err && err.message ? err.message : 'unknown error'));
    }
  }
</script>
</body>
</html>
