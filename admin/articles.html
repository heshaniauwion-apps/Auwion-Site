<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articles — Auwion Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin-ui.css">
</head>
<body>

<div id="loadingState" class="shell-loading">Checking admin session…</div>
<div id="adminShellRoot" class="admin-layout" style="display:none;"></div>

<div id="pageContent" style="display:none;">
  <div class="page-head">
    <div>
      <h1>Articles</h1>
      <p>Manage the articles shown on the Articles page and featured on Home.</p>
    </div>
    <button class="btn btn-primary" disabled title="Coming soon">+ New article</button>
  </div>

  <div class="toolbar">
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.3-4.3"/></svg>
      <input type="text" id="articleSearch" placeholder="Search articles by title…">
    </div>
    <div class="filter-pills" id="statusFilters">
      <button class="filter-pill active" data-status="all">All</button>
      <button class="filter-pill" data-status="published">Published</button>
      <button class="filter-pill" data-status="draft">Draft</button>
    </div>
  </div>

  <div id="articlesResult">
    <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:13px;padding:40px 0;text-align:center;">Loading articles…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/admin-client.js"></script>
<script src="assets/admin-ui.js"></script>
<script>
  let allArticles = [];
  let currentStatusFilter = 'all';
  let currentSearch = '';

  (async function () {
    const admin = await initAdminShell('articles');
    if (!admin) return;
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('adminShellRoot').style.display = 'flex';
    await loadArticles();

    document.getElementById('articleSearch').addEventListener('input', function (e) {
      currentSearch = e.target.value.trim().toLowerCase();
      renderArticles();
    });

    document.querySelectorAll('#statusFilters .filter-pill').forEach(function (pill) {
      pill.addEventListener('click', function () {
        document.querySelectorAll('#statusFilters .filter-pill').forEach(function (p) { p.classList.remove('active'); });
        pill.classList.add('active');
        currentStatusFilter = pill.getAttribute('data-status');
        renderArticles();
      });
    });
  })();

  async function loadArticles() {
    const container = document.getElementById('articlesResult');
    try {
      const { data, error } = await adminSupabase
        .from('articles')
        .select('id, slug, title, tag, status, published_at, updated_at')
        .order('updated_at', { ascending: false });

      if (error) throw error;
      allArticles = data || [];
      renderArticles();
    } catch (err) {
      container.innerHTML = renderErrorBanner('Could not load articles: ' + (err && err.message ? err.message : 'unknown error'));
    }
  }

  function renderArticles() {
    const container = document.getElementById('articlesResult');

    const filtered = allArticles.filter(function (a) {
      const statusOk = currentStatusFilter === 'all' || a.status === currentStatusFilter;
      const searchOk = !currentSearch || a.title.toLowerCase().indexOf(currentSearch) !== -1;
      return statusOk && searchOk;
    });

    if (allArticles.length === 0) {
      container.innerHTML = renderStateBlock({
        icon: 'articles',
        title: 'No articles yet',
        description: 'Article management (create, edit, publish) is coming in the next step. Once articles exist, this search and filter bar will work against them.',
      });
      return;
    }

    if (filtered.length === 0) {
      container.innerHTML = renderStateBlock({
        icon: 'search',
        title: 'No matching articles',
        description: 'Try a different search term or filter.',
      });
      return;
    }

    const rows = filtered.map(function (a) {
      const badge = a.status === 'published' ? 'badge-published' : 'badge-draft';
      return '<tr class="clickable"><td>' + escapeHtml(a.title) + '</td><td>' + escapeHtml(a.tag) + '</td>' +
        '<td><span class="badge ' + badge + '">' + escapeHtml(a.status) + '</span></td><td>' + formatDate(a.updated_at) + '</td></tr>';
    }).join('');

    container.innerHTML =
      '<div class="ac-table-wrap"><div class="table-scroll"><table class="ac-table">' +
      '<thead><tr><th>Title</th><th>Tag</th><th>Status</th><th>Updated</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
  }
</script>
</body>
</html>
