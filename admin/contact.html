<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Messages — Auwion Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin-ui.css">
</head>
<body>

<div id="loadingState" class="shell-loading">Checking admin session…</div>
<div id="adminShellRoot" class="admin-layout" style="display:none;"></div>

<div id="pageContent" style="display:none;">
  <div class="page-head">
    <div>
      <h1>Contact Messages</h1>
      <p>Submissions from the contact form on your About page.</p>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.3-4.3"/></svg>
      <input type="text" id="msgSearch" placeholder="Search by name or email…" disabled>
    </div>
    <div class="filter-pills">
      <button class="filter-pill active" disabled>All</button>
      <button class="filter-pill" disabled>Unread</button>
    </div>
  </div>

  <div id="contactResult">
    <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:13px;padding:40px 0;text-align:center;">Loading messages…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/admin-client.js"></script>
<script src="assets/admin-ui.js"></script>
<script>
  (async function () {
    const admin = await initAdminShell('contact');
    if (!admin) return;
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('adminShellRoot').style.display = 'flex';
    loadMessages();
  })();

  async function loadMessages() {
    const container = document.getElementById('contactResult');
    try {
      const { data, error } = await adminSupabase
        .from('contact_messages')
        .select('*')
        .order('id', { ascending: false });

      if (error) throw error;

      if (!data || data.length === 0) {
        container.innerHTML = renderStateBlock({
          icon: 'inbox',
          title: 'No messages yet',
          description: 'Submissions from the About page contact form will appear here.',
        });
        return;
      }

      const rows = data.map(function (m) {
        return '<tr><td>' + escapeHtml(m.full_name) + '</td><td>' + escapeHtml(m.email) + '</td><td>' + escapeHtml(m.message).slice(0, 60) + '…</td></tr>';
      }).join('');

      container.innerHTML =
        '<div class="ac-table-wrap"><div class="table-scroll"><table class="ac-table">' +
        '<thead><tr><th>Name</th><th>Email</th><th>Message</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div></div>';
    } catch (err) {
      // This is expected right now: the contact_messages table used by
      // about.html's contact form does not exist in this Supabase project
      // yet (your public site's auth/backend is currently disconnected —
      // see assets/supabase-client.js). This banner reflects that
      // honestly rather than hiding it.
      container.innerHTML = renderErrorBanner(
        'Could not load contact messages: ' + (err && err.message ? err.message : 'unknown error') +
        '. This table does not exist in the connected Supabase project yet — it will appear once your public contact form is connected to a real backend.'
      );
    }
  }
</script>
</body>
</html>
