<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Builder Page — Auwion Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin-ui.css">
<style>
  .fieldset{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;}
  .fieldset h3{font-family:var(--font-display);font-size:15px;margin:0 0 16px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:700px){.field-row{grid-template-columns:1fr;}}
  .palette{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .palette button{
    font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:100px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--text-soft);cursor:pointer;
  }
  .palette button:hover{border-color:var(--teal);color:var(--text);}
  .block-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:12px;cursor:grab;
  }
  .block-card.dragging{opacity:.4;}
  .block-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .block-type-label{
    font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--text-dim);display:flex;align-items:center;gap:8px;
  }
  .drag-handle{cursor:grab;color:var(--text-dim);}
  .block-actions{display:flex;gap:8px;}
  .column-box{border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:12px;}
  .column-box h4{font-size:12px;color:var(--text-dim);margin:0 0 10px;font-family:var(--font-mono);}
  .card-item{border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}
  .sticky-actions{
    position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);
    padding:14px 0;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .builder-split{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  @media(max-width:1000px){.builder-split{grid-template-columns:1fr;}}
  .builder-preview-col{
    position:sticky;top:20px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden;
  }
  .builder-preview-header{
    padding:10px 16px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:11px;
    color:var(--text-dim);display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.04em;
  }
  #previewFrame{width:100%;height:75vh;border:none;display:block;background:#fff;}
</style>
</head>
<body>

<div id="loadingState" class="shell-loading">Checking admin session…</div>
<div id="adminShellRoot" class="admin-layout" style="display:none;"></div>

<div id="pageContent" style="display:none;">
  <div class="page-head">
    <div>
      <h1 id="editorTitle">Add page</h1>
      <p id="editorSlugLine" style="font-family:var(--font-mono);"></p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span class="badge" id="statusBadge" style="display:none;"></span>
      <a href="builder-pages.html" class="btn btn-secondary btn-sm">← Back to Page Builder</a>
    </div>
  </div>

  <div id="editorError"></div>

  <div class="builder-split">
    <div class="builder-editor-col">
      <div class="fieldset">
        <h3>Page details</h3>
        <div class="field-row">
          <div class="ac-field">
            <label for="pageTitle">Title (admin label)</label>
            <input type="text" id="pageTitle">
          </div>
          <div class="ac-field">
            <label for="pageSlug">Slug (URL becomes <code>page.html?slug=…</code>)</label>
            <input type="text" id="pageSlug" placeholder="e.g. spring-promo">
          </div>
        </div>
        <div class="field-row">
          <div class="ac-field">
            <label for="pageSeoTitle">SEO title (optional)</label>
            <input type="text" id="pageSeoTitle">
          </div>
          <div class="ac-field">
            <label for="pageSeoDesc">SEO description (optional)</label>
            <input type="text" id="pageSeoDesc">
          </div>
        </div>
      </div>

      <div class="fieldset">
        <h3>Add a block</h3>
        <div class="palette">
          <button data-type="heading">+ Heading</button>
          <button data-type="paragraph">+ Paragraph</button>
          <button data-type="image">+ Image</button>
          <button data-type="button">+ Button</button>
          <button data-type="spacer">+ Spacer</button>
          <button data-type="section">+ Section</button>
          <button data-type="columns">+ Columns</button>
          <button data-type="card_grid">+ Card grid</button>
        </div>
        <p style="font-size:12px;color:var(--text-dim);margin:0;">Drag a block by its ⠿ handle to reorder. The preview on the right updates as you type.</p>
      </div>

      <div id="blocksList"></div>
    </div>

    <div class="builder-preview-col">
      <div class="builder-preview-header">
        <span>Live preview</span>
        <a href="#" id="previewLink" target="_blank" style="color:var(--text-dim);text-decoration:underline;">Open full page ↗</a>
      </div>
      <iframe id="previewFrame" title="Live preview"></iframe>
    </div>
  </div>

  <div class="sticky-actions">
    <div class="status-toggle">
      <label style="font-size:13px;font-weight:600;color:var(--text-soft);">Status</label>
      <select id="statusSelect" class="ac-field" style="width:auto;padding:8px 12px;">
        <option value="draft">Draft</option>
        <option value="published">Published</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-danger" id="deletePageBtn" style="display:none;">Delete page</button>
      <a href="#" id="previewLinkBottom" target="_blank" class="btn btn-secondary">Preview ↗</a>
      <button class="btn btn-primary" id="saveBtn">Save changes</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/admin-client.js"></script>
<script src="assets/admin-ui.js"></script>
<script src="../assets/builder-render.js"></script>
<script>
  let currentPage = null;
  let isNewPage = false;
  let blocks = [];        // top-level blocks (columns/section blocks carry a .children array)
  let deletedIds = [];    // real (saved) block ids removed during this session
  let tempIdCounter = 0;
  let currentAdmin = null;

  const ICON_OPTIONS_UNUSED = null; // n/a here

  (async function () {
    const admin = await initAdminShell('page-builder');
    if (!admin) return;
    currentAdmin = admin;
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('adminShellRoot').style.display = 'flex';

    const slug = new URLSearchParams(window.location.search).get('slug');
    wirePalette();
    document.getElementById('saveBtn').addEventListener('click', savePage);

    if (!slug) {
      isNewPage = true;
      currentPage = { id: null, slug: '', title: '', status: 'draft', seo_title: '', seo_description: '' };
      document.getElementById('editorTitle').textContent = 'Add page';
      document.getElementById('editorSlugLine').textContent = 'Creating a new builder page';
      renderBlocksList();
      updatePreviewLink();
      return;
    }
    await loadPage(slug);
  })();

  async function loadPage(slug) {
    try {
      const { data: page, error: pageError } = await adminSupabase
        .from('builder_pages').select('*').eq('slug', slug).maybeSingle();
      if (pageError) throw pageError;
      if (!page) { document.getElementById('editorError').innerHTML = renderErrorBanner('Page not found: ' + slug); return; }

      const { data: allBlocks, error: blocksError } = await adminSupabase
        .from('builder_blocks').select('*').eq('page_id', page.id).order('display_order', { ascending: true });
      if (blocksError) throw blocksError;

      currentPage = page;
      const top = (allBlocks || []).filter(function (b) { return !b.parent_block_id; });
      top.forEach(function (b) {
        if (b.type === 'columns' || b.type === 'section') {
          b.children = (allBlocks || []).filter(function (c) { return c.parent_block_id === b.id; });
        }
      });
      blocks = top;

      document.getElementById('editorTitle').textContent = page.title;
      document.getElementById('editorSlugLine').textContent = 'page.html?slug=' + page.slug;
      document.getElementById('deletePageBtn').style.display = 'inline-flex';
      updateStatusBadge(page.status);

      document.getElementById('pageTitle').value = page.title || '';
      document.getElementById('pageSlug').value = page.slug || '';
      document.getElementById('pageSeoTitle').value = page.seo_title || '';
      document.getElementById('pageSeoDesc').value = page.seo_description || '';
      document.getElementById('statusSelect').value = page.status;

      document.getElementById('deletePageBtn').addEventListener('click', deletePage);

      renderBlocksList();
      updatePreviewLink();
    } catch (err) {
      document.getElementById('editorError').innerHTML = renderErrorBanner('Could not load page: ' + (err && err.message ? err.message : 'unknown error'));
    }
  }

  function updateStatusBadge(status) {
    const el = document.getElementById('statusBadge');
    el.style.display = 'inline-block';
    el.textContent = status;
    el.className = 'badge ' + (status === 'published' ? 'badge-published' : 'badge-draft');
  }

  function updatePreviewLink() {
    const slug = document.getElementById('pageSlug').value.trim();
    const links = [document.getElementById('previewLink'), document.getElementById('previewLinkBottom')];
    links.forEach(function (link) {
      if (!link) return;
      if (slug) { link.href = '../page.html?slug=' + encodeURIComponent(slug); link.style.opacity = '1'; link.style.pointerEvents = 'auto'; }
      else { link.href = '#'; link.style.opacity = '.5'; link.style.pointerEvents = 'none'; }
    });
  }

  function defaultProps(type) {
    switch (type) {
      case 'heading': return { text: 'New heading', level: 'h2', align: 'left', color: 'dark', size: 'md' };
      case 'paragraph': return { text: 'New paragraph text.', align: 'left', color: 'soft', size: 'md' };
      case 'image': return { url: '', alt: '', width: 'full', align: 'left' };
      case 'button': return { label: 'Click here', url: '#', style: 'primary', align: 'left' };
      case 'spacer': return { height: 'md' };
      case 'section': return { background: 'none', padding: 'md' };
      case 'columns': return { count: 2, gap: 'md' };
      case 'card_grid': return { columns: 2, cards: [{ title: 'Card 1', text: 'Description' }, { title: 'Card 2', text: 'Description' }] };
      default: return {};
    }
  }

  function wirePalette() {
    document.querySelectorAll('.palette button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const type = btn.getAttribute('data-type');
        const block = { id: 'new-' + (tempIdCounter++), type: type, props: defaultProps(type), display_order: blocks.length + 1 };
        if (type === 'columns' || type === 'section') block.children = [];
        blocks.push(block);
        renderBlocksList();
      });
    });
  }

  function removeBlock(index) {
    const b = blocks[index];
    if (!String(b.id).startsWith('new-')) deletedIds.push(b.id);
    if (b.children) { b.children.forEach(function (c) { if (!String(c.id).startsWith('new-')) deletedIds.push(c.id); }); }
    blocks.splice(index, 1);
    renderBlocksList();
  }

  function duplicateBlock(index) {
    const orig = blocks[index];
    const copy = JSON.parse(JSON.stringify(orig));
    copy.id = 'new-' + (tempIdCounter++);
    if (copy.children) copy.children.forEach(function (c) { c.id = 'new-' + (tempIdCounter++); });
    blocks.splice(index + 1, 0, copy);
    renderBlocksList();
  }

  // ---- Drag-to-reorder (native HTML5 DnD) ----
  let dragFromIndex = null;
  function wireDragHandlers() {
    document.querySelectorAll('.block-card').forEach(function (card) {
      card.addEventListener('dragstart', function () {
        dragFromIndex = parseInt(card.getAttribute('data-index'), 10);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', function () { card.classList.remove('dragging'); });
      card.addEventListener('dragover', function (e) { e.preventDefault(); });
      card.addEventListener('drop', function (e) {
        e.preventDefault();
        const toIndex = parseInt(card.getAttribute('data-index'), 10);
        if (dragFromIndex === null || dragFromIndex === toIndex) return;
        const moved = blocks.splice(dragFromIndex, 1)[0];
        blocks.splice(toIndex, 0, moved);
        renderBlocksList();
      });
    });
  }

  function renderBlocksList() {
    const el = document.getElementById('blocksList');
    if (blocks.length === 0) {
      el.innerHTML = renderStateBlock({ icon: 'pages', title: 'No blocks yet', description: 'Use the buttons above to add your first block.' });
      updatePreview();
      return;
    }
    el.innerHTML = blocks.map(function (b, i) { return renderBlockCard(b, i); }).join('');
    blocks.forEach(function (b, i) { bindBlockFields(b, i); });
    wireDragHandlers();
    updatePreview();
  }

  // ---- Live preview ----
  // Converts the in-memory `blocks` (which nest a .children array inside
  // columns/section blocks) into the flat { topLevel, childrenByBlock }
  // shape that the shared renderBuilderPageHtml() expects — the exact
  // same function the real page.html uses, so the preview can't drift
  // out of sync with what visitors actually see.
  function blocksToRenderFormat() {
    const topLevel = blocks.map(function (b) { return { id: b.id, type: b.type, props: b.props }; });
    const childrenByBlock = {};
    blocks.forEach(function (b) {
      if (Array.isArray(b.children)) {
        childrenByBlock[b.id] = b.children.map(function (c) {
          return { id: c.id, type: c.type, props: c.props, column_index: (c.column_index === undefined ? null : c.column_index) };
        });
      }
    });
    return { topLevel: topLevel, childrenByBlock: childrenByBlock };
  }

  let previewDebounceTimer = null;
  function schedulePreviewUpdate() {
    clearTimeout(previewDebounceTimer);
    previewDebounceTimer = setTimeout(updatePreview, 150);
  }

  function updatePreview() {
    const iframe = document.getElementById('previewFrame');
    if (!iframe || typeof renderBuilderPageHtml !== 'function') return;
    const { topLevel, childrenByBlock } = blocksToRenderFormat();
    const html = renderBuilderPageHtml(topLevel, childrenByBlock);
    iframe.srcdoc =
      '<!DOCTYPE html><html><head><meta charset="utf-8">' +
      '<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">' +
      '<style>' + BUILDER_PREVIEW_CSS + '</style></head><body>' + html + '</body></html>';
  }

  // Event delegation: any input/change inside the block list re-reads
  // that one block's fields and refreshes the preview — this is what
  // makes the preview feel "live" instead of only updating on Save.
  document.getElementById('blocksList').addEventListener('input', function (e) {
    const match = e.target.id.match(/^b(\d+)-/);
    if (!match) return;
    readBlockFormIntoProps(parseInt(match[1], 10));
    schedulePreviewUpdate();
  });
  document.getElementById('blocksList').addEventListener('change', function (e) {
    const match = e.target.id.match(/^b(\d+)-/);
    if (!match) return;
    const idx = parseInt(match[1], 10);
    readBlockFormIntoProps(idx);
    // Changing a columns block's column count, or a section's settings,
    // needs its own sub-editor re-rendered, not just the preview.
    if (e.target.id.endsWith('-count') && blocks[idx].type === 'columns') renderColumnBoxes(blocks[idx], idx);
    updatePreview();
  });

  function fieldRow(labelText, inputHtml) {
    return '<div class="ac-field"><label>' + escapeHtml(labelText) + '</label>' + inputHtml + '</div>';
  }
  function selectHtml(id, options, current) {
    return '<select id="' + id + '">' + options.map(function (o) {
      return '<option value="' + o + '"' + (o === current ? ' selected' : '') + '>' + o + '</option>';
    }).join('') + '</select>';
  }

  function renderBlockCard(b, i) {
    let fieldsHtml = '';
    const p = b.props || {};
    const fid = 'b' + i + '-';

    if (b.type === 'heading') {
      fieldsHtml =
        fieldRow('Text', '<input type="text" id="' + fid + 'text">') +
        '<div class="field-row">' +
        fieldRow('Level', selectHtml(fid + 'level', ['h1', 'h2', 'h3'], p.level)) +
        fieldRow('Size', selectHtml(fid + 'size', ['sm', 'md', 'lg', 'xl'], p.size)) +
        '</div><div class="field-row">' +
        fieldRow('Align', selectHtml(fid + 'align', ['left', 'center', 'right'], p.align)) +
        fieldRow('Color', selectHtml(fid + 'color', ['dark', 'soft', 'teal', 'blue', 'white'], p.color)) +
        '</div>';
    } else if (b.type === 'paragraph') {
      fieldsHtml =
        fieldRow('Text', '<textarea id="' + fid + 'text" rows="2"></textarea>') +
        '<div class="field-row">' +
        fieldRow('Size', selectHtml(fid + 'size', ['sm', 'md', 'lg', 'xl'], p.size)) +
        fieldRow('Align', selectHtml(fid + 'align', ['left', 'center', 'right'], p.align)) +
        '</div>' + fieldRow('Color', selectHtml(fid + 'color', ['dark', 'soft', 'teal', 'blue', 'white'], p.color));
    } else if (b.type === 'image') {
      fieldsHtml =
        fieldRow('Image', '<input type="text" id="' + fid + 'url" placeholder="https://… or upload below">' +
          '<div style="display:flex;align-items:center;gap:10px;margin-top:8px;">' +
          '<input type="file" id="' + fid + 'file" accept="image/png,image/jpeg,image/webp,image/gif" style="font-size:12px;">' +
          '<button type="button" class="btn btn-secondary btn-sm" onclick="uploadBlockImage(' + i + ')">Upload</button>' +
          '<span id="' + fid + 'uploadStatus" style="font-size:12px;color:var(--text-dim);"></span>' +
          '</div>') +
        fieldRow('Alt text', '<input type="text" id="' + fid + 'alt">') +
        '<div class="field-row">' +
        fieldRow('Width', selectHtml(fid + 'width', ['full', 'half', 'third'], p.width)) +
        fieldRow('Align', selectHtml(fid + 'align', ['left', 'center', 'right'], p.align)) +
        '</div>';
    } else if (b.type === 'button') {
      fieldsHtml =
        '<div class="field-row">' +
        fieldRow('Label', '<input type="text" id="' + fid + 'label">') +
        fieldRow('Link URL', '<input type="text" id="' + fid + 'url">') +
        '</div><div class="field-row">' +
        fieldRow('Style', selectHtml(fid + 'style', ['primary', 'secondary', 'ghost', 'dark'], p.style)) +
        fieldRow('Align', selectHtml(fid + 'align', ['left', 'center', 'right'], p.align)) +
        '</div>';
    } else if (b.type === 'spacer') {
      fieldsHtml = fieldRow('Height', selectHtml(fid + 'height', ['sm', 'md', 'lg', 'xl'], p.height));
    } else if (b.type === 'section') {
      fieldsHtml =
        '<div class="field-row">' +
        fieldRow('Background', selectHtml(fid + 'background', ['none', 'surface', 'dark', 'gradient'], p.background)) +
        fieldRow('Padding', selectHtml(fid + 'padding', ['sm', 'md', 'lg', 'xl'], p.padding)) +
        '</div>' +
        '<p style="font-size:12px;color:var(--text-dim);margin:4px 0 10px;">If you choose a dark or gradient background, remember to set your text blocks\' color to "white" so they stay readable.</p>' +
        '<div id="' + fid + 'sectionChildren"></div>' +
        '<div class="palette" style="margin-bottom:0;">' +
        '<button type="button" onclick="addSectionChild(' + i + ',\'heading\')">+ Heading</button>' +
        '<button type="button" onclick="addSectionChild(' + i + ',\'paragraph\')">+ Paragraph</button>' +
        '<button type="button" onclick="addSectionChild(' + i + ',\'button\')">+ Button</button>' +
        '<button type="button" onclick="addSectionChild(' + i + ',\'image\')">+ Image</button>' +
        '<button type="button" onclick="addSectionChild(' + i + ',\'spacer\')">+ Spacer</button>' +
        '</div>';
    } else if (b.type === 'columns') {
      fieldsHtml =
        '<div class="field-row">' +
        fieldRow('Columns', selectHtml(fid + 'count', ['2', '3'], String(p.count || 2))) +
        fieldRow('Gap', selectHtml(fid + 'gap', ['sm', 'md', 'lg'], p.gap)) +
        '</div>' +
        '<div class="field-row" id="' + fid + 'columnsBoxes" style="margin-top:10px;"></div>';
    } else if (b.type === 'card_grid') {
      const cards = Array.isArray(p.cards) ? p.cards : [];
      fieldsHtml =
        fieldRow('Columns', selectHtml(fid + 'columns', ['2', '3'], String(p.columns || 2))) +
        '<div id="' + fid + 'cardsBox">' +
        cards.map(function (c, ci) {
          return '<div class="card-item"><div class="field-row">' +
            fieldRow('Card ' + (ci + 1) + ' title', '<input type="text" id="' + fid + 'card' + ci + '-title" value="' + escapeHtml(c.title) + '">') +
            fieldRow('Card ' + (ci + 1) + ' text', '<input type="text" id="' + fid + 'card' + ci + '-text" value="' + escapeHtml(c.text) + '">') +
            '</div></div>';
        }).join('') +
        '</div>' +
        '<button type="button" class="btn btn-secondary btn-sm" onclick="addCard(' + i + ')">+ Add card</button>';
    }

    return '<div class="block-card" draggable="true" data-index="' + i + '">' +
      '<div class="block-card-head">' +
      '<span class="block-type-label"><span class="drag-handle">⠿</span> ' + b.type.replace('_', ' ') + '</span>' +
      '<div class="block-actions">' +
      '<button class="btn btn-secondary btn-sm" onclick="duplicateBlock(' + i + ')">Duplicate</button>' +
      '<button class="btn btn-danger btn-sm" onclick="removeBlock(' + i + ')">Delete</button>' +
      '</div></div>' +
      fieldsHtml +
      '</div>';
  }

  function addCard(blockIndex) {
    const b = blocks[blockIndex];
    readBlockFormIntoProps(blockIndex); // capture current field values first
    b.props.cards.push({ title: 'New card', text: 'Description' });
    renderBlocksList();
  }

  function bindBlockFields(b, i) {
    const p = b.props || {};
    const fid = 'b' + i + '-';
    if (b.type === 'heading') { setVal(fid + 'text', p.text); }
    else if (b.type === 'paragraph') { setVal(fid + 'text', p.text); }
    else if (b.type === 'image') { setVal(fid + 'url', p.url); setVal(fid + 'alt', p.alt); }
    else if (b.type === 'button') { setVal(fid + 'label', p.label); setVal(fid + 'url', p.url); }
    else if (b.type === 'columns') { renderColumnBoxes(b, i); }
    else if (b.type === 'section') { renderSectionChildren(b, i); }
  }

  function setVal(id, val) { const el = document.getElementById(id); if (el) el.value = val || ''; }

  function renderColumnBoxes(b, i) {
    const fid = 'b' + i + '-';
    const container = document.getElementById(fid + 'columnsBoxes');
    if (!container) return;
    const count = parseInt((document.getElementById(fid + 'count') || {}).value || b.props.count || 2, 10);
    container.style.gridTemplateColumns = 'repeat(' + count + ', 1fr)';
    let html = '';
    for (let ci = 0; ci < count; ci++) {
      const colBlocks = (b.children || []).filter(function (c) { return c.column_index === ci; });
      html += '<div class="column-box"><h4>Column ' + (ci + 1) + '</h4>' +
        colBlocks.map(function (c, cbi) {
          const globalKey = fid + 'col' + ci + '-' + cbi;
          return renderMiniChildEditor(c, globalKey);
        }).join('') +
        '<div class="palette" style="margin-bottom:0;">' +
        '<button type="button" onclick="addColumnChild(' + i + ',' + ci + ',\'heading\')">+ Heading</button>' +
        '<button type="button" onclick="addColumnChild(' + i + ',' + ci + ',\'paragraph\')">+ Paragraph</button>' +
        '<button type="button" onclick="addColumnChild(' + i + ',' + ci + ',\'button\')">+ Button</button>' +
        '</div></div>';
    }
    container.innerHTML = html;
    // re-bind values for freshly rendered child inputs
    (b.children || []).forEach(function (c, idx) {
      const key = fid + 'col' + c.column_index + '-' + (b.children.filter(function (x) { return x.column_index === c.column_index; }).indexOf(c));
      if (c.type === 'heading' || c.type === 'paragraph') setVal(key + '-text', c.props.text);
      if (c.type === 'button') { setVal(key + '-label', c.props.label); setVal(key + '-url', c.props.url); }
    });
  }

  function renderMiniChildEditor(c, key) {
    if (c.type === 'heading') return '<div class="ac-field"><input type="text" id="' + key + '-text" placeholder="Heading text"></div>';
    if (c.type === 'paragraph') return '<div class="ac-field"><textarea id="' + key + '-text" rows="2" placeholder="Paragraph text"></textarea></div>';
    if (c.type === 'button') return '<div class="ac-field" style="display:flex;gap:6px;"><input type="text" id="' + key + '-label" placeholder="Label" style="flex:1;"><input type="text" id="' + key + '-url" placeholder="URL" style="flex:1;"></div>';
    if (c.type === 'image') return '<div class="ac-field" style="display:flex;gap:6px;"><input type="text" id="' + key + '-url" placeholder="Image URL" style="flex:2;"><input type="text" id="' + key + '-alt" placeholder="Alt text" style="flex:1;"></div>';
    if (c.type === 'spacer') return '<div class="ac-field">' + selectHtml(key + '-height', ['sm', 'md', 'lg', 'xl'], c.props.height) + '</div>';
    return '';
  }

  // ---- Section children (flat list, no columns) ----
  function renderSectionChildren(b, i) {
    const fid = 'b' + i + '-';
    const container = document.getElementById(fid + 'sectionChildren');
    if (!container) return;
    const children = b.children || [];
    if (children.length === 0) {
      container.innerHTML = '<p style="font-size:12px;color:var(--text-dim);">No content in this section yet — add a block below.</p>';
      return;
    }
    container.innerHTML = children.map(function (c, ci) {
      const key = fid + 'sec' + ci;
      return '<div class="card-item"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
        '<span style="font-size:11px;font-family:var(--font-mono);color:var(--text-dim);text-transform:uppercase;">' + c.type + '</span>' +
        '<button type="button" class="btn btn-danger btn-sm" onclick="removeSectionChild(' + i + ',' + ci + ')">Remove</button>' +
        '</div>' + renderMiniChildEditor(c, key) + '</div>';
    }).join('');
    children.forEach(function (c, ci) {
      const key = fid + 'sec' + ci;
      if (c.type === 'heading' || c.type === 'paragraph') setVal(key + '-text', c.props.text);
      if (c.type === 'button') { setVal(key + '-label', c.props.label); setVal(key + '-url', c.props.url); }
      if (c.type === 'image') { setVal(key + '-url', c.props.url); setVal(key + '-alt', c.props.alt); }
    });
  }

  function addSectionChild(blockIndex, type) {
    const b = blocks[blockIndex];
    readBlockFormIntoProps(blockIndex); // don't lose anything already typed
    b.children = b.children || [];
    b.children.push({ id: 'new-' + (tempIdCounter++), type: type, column_index: null, props: defaultProps(type) });
    renderBlocksList();
  }

  function removeSectionChild(blockIndex, childIndex) {
    const b = blocks[blockIndex];
    readBlockFormIntoProps(blockIndex);
    const child = b.children[childIndex];
    if (!String(child.id).startsWith('new-')) deletedIds.push(child.id);
    b.children.splice(childIndex, 1);
    renderBlocksList();
  }

  // ---- Image upload (Storage bucket: site-media) ----
  async function uploadFileAndGetUrl(file) {
    const okTypes = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];
    if (okTypes.indexOf(file.type) === -1) {
      showToast({ type: 'error', message: 'Only PNG, JPEG, WEBP, or GIF images are supported.' });
      return null;
    }
    if (file.size > 5 * 1024 * 1024) {
      showToast({ type: 'error', message: 'Image must be under 5MB.' });
      return null;
    }
    const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
    const path = Date.now() + '-' + safeName;
    try {
      const { error: uploadErr } = await adminSupabase.storage.from('site-media').upload(path, file);
      if (uploadErr) throw uploadErr;
      const { data: urlData } = adminSupabase.storage.from('site-media').getPublicUrl(path);
      const publicUrl = urlData.publicUrl;
      try {
        await adminSupabase.from('media').insert({
          file_name: file.name, storage_path: path, public_url: publicUrl,
          uploaded_by: currentAdmin ? currentAdmin.id : null,
        });
      } catch (mediaErr) { /* non-fatal — image is still usable even if this record fails */ }
      return publicUrl;
    } catch (err) {
      showToast({ type: 'error', message: 'Upload failed: ' + (err && err.message ? err.message : 'unknown error') });
      return null;
    }
  }

  async function uploadBlockImage(i) {
    const fid = 'b' + i + '-';
    const fileInput = document.getElementById(fid + 'file');
    const statusEl = document.getElementById(fid + 'uploadStatus');
    const file = fileInput.files[0];
    if (!file) { showToast({ type: 'error', message: 'Choose a file first.' }); return; }
    statusEl.textContent = 'Uploading…';
    const url = await uploadFileAndGetUrl(file);
    if (url) {
      document.getElementById(fid + 'url').value = url;
      statusEl.textContent = 'Uploaded ✓';
      showToast({ type: 'success', message: 'Image uploaded.' });
    } else {
      statusEl.textContent = '';
    }
  }

  function addColumnChild(blockIndex, columnIndex, type) {
    const b = blocks[blockIndex];
    b.children = b.children || [];
    b.children.push({ id: 'new-' + (tempIdCounter++), type: type, column_index: columnIndex, props: defaultProps(type) });
    renderBlocksList();
  }

  // Reads all current form inputs for one block back into its .props
  // object. Called before Save (and before adding a card, so nothing
  // typed is lost).
  function readBlockFormIntoProps(i) {
    const b = blocks[i];
    const fid = 'b' + i + '-';
    const g = function (id) { const el = document.getElementById(id); return el ? el.value : undefined; };

    if (b.type === 'heading') {
      b.props = { text: g(fid + 'text'), level: g(fid + 'level'), align: g(fid + 'align'), color: g(fid + 'color'), size: g(fid + 'size') };
    } else if (b.type === 'paragraph') {
      b.props = { text: g(fid + 'text'), align: g(fid + 'align'), color: g(fid + 'color'), size: g(fid + 'size') };
    } else if (b.type === 'image') {
      b.props = { url: g(fid + 'url'), alt: g(fid + 'alt'), width: g(fid + 'width'), align: g(fid + 'align') };
    } else if (b.type === 'button') {
      b.props = { label: g(fid + 'label'), url: g(fid + 'url'), style: g(fid + 'style'), align: g(fid + 'align') };
    } else if (b.type === 'spacer') {
      b.props = { height: g(fid + 'height') };
    } else if (b.type === 'section') {
      b.props = { background: g(fid + 'background'), padding: g(fid + 'padding') };
      (b.children || []).forEach(function (c, ci) {
        const key = fid + 'sec' + ci;
        if (c.type === 'heading' || c.type === 'paragraph') c.props = { text: g(key + '-text') };
        if (c.type === 'button') c.props = { label: g(key + '-label'), url: g(key + '-url') };
        if (c.type === 'image') c.props = { url: g(key + '-url'), alt: g(key + '-alt'), width: 'full', align: 'left' };
        if (c.type === 'spacer') c.props = { height: g(key + '-height') };
      });
    } else if (b.type === 'columns') {
      const count = parseInt(g(fid + 'count'), 10) || 2;
      b.props = { count: count, gap: g(fid + 'gap') };
      (b.children || []).forEach(function (c) {
        const siblings = b.children.filter(function (x) { return x.column_index === c.column_index; });
        const key = fid + 'col' + c.column_index + '-' + siblings.indexOf(c);
        if (c.type === 'heading' || c.type === 'paragraph') c.props = { text: g(key + '-text') };
        if (c.type === 'button') c.props = { label: g(key + '-label'), url: g(key + '-url') };
      });
    } else if (b.type === 'card_grid') {
      const cards = (b.props.cards || []).map(function (_, ci) {
        return { title: g(fid + 'card' + ci + '-title'), text: g(fid + 'card' + ci + '-text') };
      });
      b.props = { columns: parseInt(g(fid + 'columns'), 10) || 2, cards: cards };
    }
  }

  async function savePage() {
    const btn = document.getElementById('saveBtn');
    const titleVal = document.getElementById('pageTitle').value.trim();
    const slugVal = document.getElementById('pageSlug').value.trim();

    if (!titleVal || !slugVal) { showToast({ type: 'error', message: 'Title and slug are both required.' }); return; }
    if (!/^[a-z0-9-]+$/.test(slugVal)) { showToast({ type: 'error', message: 'Slug can only contain lowercase letters, numbers, and hyphens.' }); return; }

    blocks.forEach(function (b, i) { readBlockFormIntoProps(i); });

    btn.textContent = 'Saving...';
    btn.disabled = true;

    const pagePayload = {
      title: titleVal, slug: slugVal,
      seo_title: document.getElementById('pageSeoTitle').value || null,
      seo_description: document.getElementById('pageSeoDesc').value || null,
      status: document.getElementById('statusSelect').value,
    };

    try {
      let pageId;
      if (isNewPage) {
        const { data: created, error: createErr } = await adminSupabase.from('builder_pages').insert(pagePayload).select().single();
        if (createErr) throw createErr;
        pageId = created.id; currentPage = created; isNewPage = false;
      } else {
        const { data: updated, error: updateErr } = await adminSupabase.from('builder_pages').update(pagePayload).eq('id', currentPage.id).select().single();
        if (updateErr) throw updateErr;
        pageId = updated.id; currentPage = updated;
      }

      // Delete any blocks removed during this session.
      for (const delId of deletedIds) {
        await adminSupabase.from('builder_blocks').delete().eq('id', delId);
      }
      deletedIds = [];

      // Upsert top-level blocks in order, then their children (columns).
      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        const isNewBlock = String(b.id).startsWith('new-');
        const rowPayload = { page_id: pageId, parent_block_id: null, column_index: null, type: b.type, display_order: i + 1, props: b.props };

        let realId = b.id;
        if (isNewBlock) {
          const { data: createdBlock, error: cErr } = await adminSupabase.from('builder_blocks').insert(rowPayload).select().single();
          if (cErr) throw cErr;
          realId = createdBlock.id; b.id = realId;
        } else {
          const { error: uErr } = await adminSupabase.from('builder_blocks').update(rowPayload).eq('id', b.id);
          if (uErr) throw uErr;
        }

        if ((b.type === 'columns' || b.type === 'section') && Array.isArray(b.children)) {
          for (let ci = 0; ci < b.children.length; ci++) {
            const child = b.children[ci];
            const childPayload = { page_id: pageId, parent_block_id: realId, column_index: (child.column_index === undefined ? null : child.column_index), type: child.type, display_order: ci + 1, props: child.props };
            if (String(child.id).startsWith('new-')) {
              const { data: createdChild, error: ccErr } = await adminSupabase.from('builder_blocks').insert(childPayload).select().single();
              if (ccErr) throw ccErr;
              child.id = createdChild.id;
            } else {
              const { error: cuErr } = await adminSupabase.from('builder_blocks').update(childPayload).eq('id', child.id);
              if (cuErr) throw cuErr;
            }
          }
        }
      }

      updateStatusBadge(currentPage.status);
      document.getElementById('editorTitle').textContent = currentPage.title;
      document.getElementById('editorSlugLine').textContent = 'page.html?slug=' + currentPage.slug;
      document.getElementById('deletePageBtn').style.display = 'inline-flex';
      if (!document.getElementById('deletePageBtn').onclick) document.getElementById('deletePageBtn').addEventListener('click', deletePage);
      updatePreviewLink();
      showToast({ type: 'success', message: 'Page saved. Changes are live if published.' });
    } catch (err) {
      showToast({ type: 'error', message: 'Save failed: ' + (err && err.message ? err.message : 'unknown error') });
    } finally {
      btn.textContent = 'Save changes';
      btn.disabled = false;
    }
  }

  async function deletePage() {
    const confirmed = await confirmDialog({
      title: 'Delete "' + currentPage.title + '"?',
      message: 'This permanently deletes the page and all its blocks. This cannot be undone.',
      confirmLabel: 'Delete page',
      danger: true,
    });
    if (!confirmed) return;
    try {
      const { error } = await adminSupabase.from('builder_pages').delete().eq('id', currentPage.id);
      if (error) throw error;
      showToast({ type: 'success', message: 'Page deleted.' });
      setTimeout(function () { window.location.href = 'builder-pages.html'; }, 600);
    } catch (err) {
      showToast({ type: 'error', message: 'Delete failed: ' + (err && err.message ? err.message : 'unknown error') });
    }
  }
</script>
