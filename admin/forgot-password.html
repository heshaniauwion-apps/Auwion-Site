<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Auwion Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --bg-2:#FFFFFF; --card:rgba(16,20,43,0.04); --border:rgba(16,20,43,0.12);
    --pink:#15024C; --teal:#0FA898; --text:#10142B; --text-soft:#4B5170; --text-dim:#848AA8;
    --grad: linear-gradient(90deg, var(--pink), var(--teal));
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;padding:24px;}
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:18px;text-decoration:none;color:var(--text);}
  .wordmark span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .admin-tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-left:8px;border:1px solid var(--border);border-radius:100px;padding:2px 10px;}
  .auth-card{width:100%;max-width:400px;background:var(--bg-2);border:1px solid var(--border);border-radius:16px;padding:36px 32px;box-shadow:0 20px 40px rgba(16,20,43,0.06);}
  .brand-row{display:flex;align-items:center;margin-bottom:26px;}
  h1{font-family:var(--font-display);font-size:22px;margin:0 0 6px;}
  .sub{color:var(--text-soft);font-size:14px;margin:0 0 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-soft);}
  .field input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--font-body);font-size:14px;}
  .field input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .btn-primary{width:100%;padding:12px;border-radius:100px;border:none;background:var(--grad);color:#fff;font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s ease;}
  .btn-primary:hover{opacity:0.9;}
  .btn-primary:disabled{opacity:0.6;cursor:not-allowed;}
  .msg{font-size:13px;margin-bottom:14px;padding:10px 12px;border-radius:8px;display:none;}
  .msg.error{background:rgba(226,63,58,0.08);color:#C23A2E;display:block;}
  .msg.info{background:rgba(15,168,152,0.08);color:#0B7A6E;display:block;}
  .back-link{display:block;margin-top:20px;text-align:center;font-size:13px;color:var(--text-dim);text-decoration:none;}
  .back-link:hover{color:var(--teal);}
</style>
</head>
<body>

<div class="auth-card">
  <div class="brand-row">
    <a href="../index.html" class="wordmark">AUW<span>I</span>ON</a>
    <span class="admin-tag">Admin</span>
  </div>
  <h1>Forgot password</h1>
  <p class="sub">Enter your admin email and we'll send a reset link.</p>

  <div id="resultMessage" class="msg" style="display:none;"></div>

  <form id="forgotForm">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="name@auwion.com" required autocomplete="username">
    </div>
    <button type="submit" class="btn-primary" id="sendBtn">Send reset link</button>
  </form>

  <a href="login.html" class="back-link">← Back to admin login</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/admin-client.js"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('sendBtn');
    var msg = document.getElementById('resultMessage');
    var form = document.getElementById('forgotForm');

    btn.textContent = 'Sending...';
    btn.disabled = true;

    try {
      if (typeof adminRequestPasswordReset !== 'function') {
        throw new Error('Admin script did not load correctly (stale cache). Please hard-refresh this page (Ctrl+Shift+R / Cmd+Shift+R) and try again.');
      }

      await adminRequestPasswordReset({
        email: document.getElementById('email').value.trim()
      });

      // Always shown, regardless of whether the email matched an admin
      // account — this avoids confirming or denying which addresses have
      // admin access.
      form.style.display = 'none';
      msg.className = 'msg info';
      msg.style.display = 'block';
      msg.textContent = "If that email belongs to an admin account, a reset link has been sent. Check your inbox.";
    } catch (err) {
      msg.className = 'msg error';
      msg.style.display = 'block';
      msg.textContent = err && err.message ? err.message : 'Something went wrong. Please try again.';
      btn.textContent = 'Send reset link';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
