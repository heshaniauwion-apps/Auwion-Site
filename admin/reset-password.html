<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Auwion Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --bg-2:#FFFFFF; --card:rgba(16,20,43,0.04); --border:rgba(16,20,43,0.12);
    --pink:#15024C; --teal:#0FA898; --text:#10142B; --text-soft:#4B5170; --text-dim:#848AA8;
    --grad: linear-gradient(90deg, var(--pink), var(--teal));
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;padding:24px;}
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:18px;text-decoration:none;color:var(--text);}
  .wordmark span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .admin-tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-left:8px;border:1px solid var(--border);border-radius:100px;padding:2px 10px;}
  .auth-card{width:100%;max-width:400px;background:var(--bg-2);border:1px solid var(--border);border-radius:16px;padding:36px 32px;box-shadow:0 20px 40px rgba(16,20,43,0.06);}
  .brand-row{display:flex;align-items:center;margin-bottom:26px;}
  h1{font-family:var(--font-display);font-size:22px;margin:0 0 6px;}
  .sub{color:var(--text-soft);font-size:14px;margin:0 0 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-soft);}
  .field input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--font-body);font-size:14px;}
  .field input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .btn-primary{width:100%;padding:12px;border-radius:100px;border:none;background:var(--grad);color:#fff;font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s ease;}
  .btn-primary:hover{opacity:0.9;}
  .btn-primary:disabled{opacity:0.6;cursor:not-allowed;}
  .msg{font-size:13px;margin-bottom:14px;padding:10px 12px;border-radius:8px;display:none;}
  .msg.error{background:rgba(226,63,58,0.08);color:#C23A2E;display:block;}
  .msg.info{background:rgba(15,168,152,0.08);color:#0B7A6E;display:block;}
  .back-link{display:block;margin-top:20px;text-align:center;font-size:13px;color:var(--text-dim);text-decoration:none;}
  .back-link:hover{color:var(--teal);}
  #loadingState{text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:13px;padding:20px 0;}
</style>
</head>
<body>

<div class="auth-card">
  <div class="brand-row">
    <a href="../index.html" class="wordmark">AUW<span>I</span>ON</a>
    <span class="admin-tag">Admin</span>
  </div>
  <h1>Reset password</h1>
  <p class="sub">Choose a new password for your admin account.</p>

  <div id="loadingState">Checking reset link…</div>

  <div id="invalidState" style="display:none;">
    <div class="msg error">This reset link is invalid or has expired. Please request a new one.</div>
    <a href="forgot-password.html" class="back-link" style="margin-top:0;">← Request a new reset link</a>
  </div>

  <form id="resetForm" style="display:none;">
    <div id="resetMessage" class="msg error"></div>
    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat password" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit" class="btn-primary" id="resetBtn">Set new password</button>
  </form>

  <div id="successState" style="display:none;">
    <div class="msg info">Password updated. Redirecting to login…</div>
  </div>

  <a href="login.html" class="back-link">← Back to admin login</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/admin-client.js"></script>
<script>
  (async function init(){
    // Supabase's client auto-parses the recovery token from the URL
    // fragment when this page loads (detectSessionInUrl, on by default)
    // and turns it into a temporary session. Give that a brief moment,
    // then check whether it succeeded.
    await new Promise(function(r){ setTimeout(r, 300); });

    var hasSession = await adminHasRecoverySession();
    document.getElementById('loadingState').style.display = 'none';

    if (hasSession) {
      document.getElementById('resetForm').style.display = 'block';
    } else {
      document.getElementById('invalidState').style.display = 'block';
    }
  })();

  document.getElementById('resetForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('resetBtn');
    var msg = document.getElementById('resetMessage');
    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('confirmPassword').value;

    msg.style.display = 'none';

    if (password !== confirmPassword) {
      msg.textContent = 'Passwords do not match.';
      msg.className = 'msg error';
      return;
    }

    btn.textContent = 'Updating...';
    btn.disabled = true;

    var result = await adminUpdatePassword({ password: password });

    if (result.ok) {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
      await adminSignOut();
      setTimeout(function(){ window.location.href = 'login.html'; }, 1800);
    } else {
      msg.textContent = result.message;
      msg.className = 'msg error';
      btn.textContent = 'Set new password';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
