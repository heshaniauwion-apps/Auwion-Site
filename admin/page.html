<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">Auwion</title>
<meta name="description" id="pageMetaDesc" content="">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F8FC; --pink:#3B82F6; --teal:#0FA898;
    --grad: linear-gradient(90deg, var(--pink), var(--teal));
    --text:#10142B; --text-soft:#4B5170; --text-dim:#848AA8;
    --border-soft:rgba(16,20,43,0.10);
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  header.site{padding:20px 0;border-bottom:1px solid var(--border-soft);background:#fff;}
  .nav{display:flex;align-items:center;justify-content:space-between;}
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:18px;text-decoration:none;color:var(--text);}
  .wordmark span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  main{padding:60px 0 80px;}
  .btn{display:inline-block;font-weight:600;font-size:14px;border-radius:100px;padding:12px 24px;text-decoration:none;}
  .btn-primary{background:var(--grad);color:#0A0820;}
  .btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border-soft);}
  .btn-ghost{background:none;color:var(--text);border:1px solid var(--border-soft);}
  .btn-dark{background:var(--text);color:#fff;}
  .columns-2{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
  .columns-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px;}
  @media(max-width:700px){.columns-2,.columns-3{grid-template-columns:1fr;}}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;}
  .builder-card{background:#fff;border:1px solid var(--border-soft);border-radius:14px;padding:24px;}
  .builder-card h3{font-family:var(--font-display);font-size:17px;margin:0 0 8px;}
  .builder-card p{color:var(--text-soft);font-size:14px;margin:0;}
  #loadingState, #notFoundState{text-align:center;padding:80px 24px;color:var(--text-dim);}
</style>
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <a href="index.html" class="wordmark">AUW<span>I</span>ON</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="loadingState">Loading…</div>
    <div id="notFoundState" style="display:none;">
      <h1 style="font-family:var(--font-display);color:var(--text);">Page not found</h1>
      <p>This page doesn't exist or hasn't been published yet.</p>
      <a href="index.html" class="btn btn-primary">← Back to home</a>
    </div>
    <div id="blocksContainer"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL = "https://stodwjjgqzsqjnskyyka.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0b2R3ampncXpzcWpuc2t5eWthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDM2NDIsImV4cCI6MjEwMjUxOTY0Mn0.E9vXhxFvmpsfki8iZhtOyhn-X-mOgXXpUaEdgLiAnZA";

  if (typeof window.supabase === 'undefined') {
    showNotFound();
    return;
  }
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });

  const COLOR_MAP = { dark: 'var(--text)', soft: 'var(--text-soft)', teal: 'var(--teal)', blue: 'var(--pink)', white: '#ffffff' };
  const HEADING_SIZE_MAP = { sm: '20px', md: '28px', lg: '36px', xl: '48px' };
  const PARA_SIZE_MAP = { sm: '14px', md: '16px', lg: '18px', xl: '20px' };
  const SPACER_MAP = { sm: '16px', md: '32px', lg: '56px', xl: '96px' };
  const SECTION_BG_MAP = { none: 'transparent', surface: '#ffffff', dark: 'var(--text)', gradient: 'var(--grad)' };
  const SECTION_PADDING_MAP = { sm: '24px', md: '48px', lg: '72px', xl: '100px' };

  // Dispatches to the right renderer for any block, including container
  // types. Used both at the top level and inside containers, so a
  // section's children (or, in principle, a column's children) can
  // themselves be any block type — the data model supports arbitrary
  // nesting even though today's admin UI only builds a couple of levels.
  function renderAnyBlock(b, childrenByBlock) {
    if (b.type === 'columns') return renderColumnsBlock(b, childrenByBlock);
    if (b.type === 'section') return renderSectionBlock(b, childrenByBlock);
    return renderBlock(b);
  }

  function renderSectionBlock(block, childrenByBlock) {
    const p = block.props || {};
    const bg = SECTION_BG_MAP[p.background] || SECTION_BG_MAP.none;
    const pad = SECTION_PADDING_MAP[p.padding] || SECTION_PADDING_MAP.md;
    const children = childrenByBlock[block.id] || [];
    const inner = children.map(function (c) { return renderAnyBlock(c, childrenByBlock); }).join('');
    const radius = (p.background && p.background !== 'none') ? 'border-radius:16px;' : '';
    return '<div style="background:' + bg + ';padding:' + pad + ';margin-bottom:16px;' + radius + '">' + inner + '</div>';
  }

  function esc(str) {
    return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderBlock(b) {
    const p = b.props || {};
    switch (b.type) {
      case 'heading': {
        const tag = p.level || 'h2';
        const color = COLOR_MAP[p.color] || COLOR_MAP.dark;
        const size = HEADING_SIZE_MAP[p.size] || HEADING_SIZE_MAP.md;
        return '<' + tag + ' style="font-family:var(--font-display);font-weight:700;text-align:' + esc(p.align || 'left') +
          ';color:' + color + ';font-size:' + size + ';margin:0 0 16px;">' + esc(p.text) + '</' + tag + '>';
      }
      case 'paragraph': {
        const color = COLOR_MAP[p.color] || COLOR_MAP.soft;
        const size = PARA_SIZE_MAP[p.size] || PARA_SIZE_MAP.md;
        return '<p style="text-align:' + esc(p.align || 'left') + ';color:' + color + ';font-size:' + size + ';margin:0 0 16px;">' + esc(p.text) + '</p>';
      }
      case 'image': {
        const width = p.width === 'half' ? '50%' : p.width === 'third' ? '33%' : '100%';
        const alignStyle = p.align === 'center' ? 'display:block;margin-left:auto;margin-right:auto;' : p.align === 'right' ? 'display:block;margin-left:auto;' : '';
        return '<img src="' + esc(p.url) + '" alt="' + esc(p.alt || '') + '" style="max-width:' + width + ';border-radius:12px;margin-bottom:16px;' + alignStyle + '">';
      }
      case 'button': {
        const style = ['primary', 'secondary', 'ghost', 'dark'].indexOf(p.style) !== -1 ? p.style : 'primary';
        const alignWrap = p.align ? 'text-align:' + esc(p.align) + ';' : '';
        return '<div style="' + alignWrap + 'margin-bottom:16px;"><a href="' + esc(p.url || '#') + '" class="btn btn-' + style + '">' + esc(p.label) + '</a></div>';
      }
      case 'spacer': {
        return '<div style="height:' + (SPACER_MAP[p.height] || SPACER_MAP.md) + ';"></div>';
      }
      case 'card_grid': {
        const cols = p.columns === 3 ? 3 : 2;
        const cards = Array.isArray(p.cards) ? p.cards : [];
        return '<div class="card-grid" style="grid-template-columns:repeat(' + cols + ',1fr);margin-bottom:16px;">' +
          cards.map(function (c) {
            return '<div class="builder-card"><h3>' + esc(c.title) + '</h3><p>' + esc(c.text) + '</p></div>';
          }).join('') + '</div>';
      }
      default:
        return '';
    }
  }

  function renderColumnsBlock(block, childrenByBlock) {
    const p = block.props || {};
    const colClass = p.count === 3 ? 'columns-3' : 'columns-2';
    const children = childrenByBlock[block.id] || [];
    const numCols = p.count === 3 ? 3 : 2;
    const colHtml = [];
    for (let i = 0; i < numCols; i++) {
      const colChildren = children.filter(function (c) { return c.column_index === i; });
      colHtml.push('<div>' + colChildren.map(function (c) { return renderAnyBlock(c, childrenByBlock); }).join('') + '</div>');
    }
    return '<div class="' + colClass + '" style="margin-bottom:16px;">' + colHtml.join('') + '</div>';
  }

  function showNotFound() {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('notFoundState').style.display = 'block';
  }

  async function loadPage() {
    const slug = new URLSearchParams(window.location.search).get('slug');
    if (!slug) { showNotFound(); return; }

    try {
      const { data: page, error: pageError } = await client
        .from('builder_pages')
        .select('*')
        .eq('slug', slug)
        .eq('status', 'published')
        .maybeSingle();

      if (pageError || !page) { showNotFound(); return; }

      if (page.seo_title) { document.title = page.seo_title; document.getElementById('pageTitleTag').textContent = page.seo_title; }
      if (page.seo_description) document.getElementById('pageMetaDesc').setAttribute('content', page.seo_description);

      const { data: blocks, error: blocksError } = await client
        .from('builder_blocks')
        .select('*')
        .eq('page_id', page.id)
        .order('display_order', { ascending: true });

      if (blocksError) { showNotFound(); return; }

      const topLevel = (blocks || []).filter(function (b) { return !b.parent_block_id; });
      const childrenByBlock = {};
      (blocks || []).forEach(function (b) {
        if (b.parent_block_id) {
          childrenByBlock[b.parent_block_id] = childrenByBlock[b.parent_block_id] || [];
          childrenByBlock[b.parent_block_id].push(b);
        }
      });

      const html = topLevel.map(function (b) {
        return renderAnyBlock(b, childrenByBlock);
      }).join('');

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('blocksContainer').innerHTML = html;
    } catch (e) {
      console.warn('[page] Failed to load builder page:', e && e.message);
      showNotFound();
    }
  }

  loadPage();
})();
</script>
</body>
</html>
