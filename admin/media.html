<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Library — Auwion Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin-ui.css">
</head>
<body>

<div id="loadingState" class="shell-loading">Checking admin session…</div>
<div id="adminShellRoot" class="admin-layout" style="display:none;"></div>

<div id="pageContent" style="display:none;">
  <div class="page-head">
    <div>
      <h1>Media Library</h1>
      <p>Upload and manage images for articles, services, and pages. Your site currently uses hand-coded icons, so this is empty until you upload your first image.</p>
    </div>
    <button class="btn btn-primary" disabled title="Coming soon">+ Upload file</button>
  </div>

  <div id="mediaResult">
    <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:13px;padding:40px 0;text-align:center;">Loading media…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/admin-client.js"></script>
<script src="assets/admin-ui.js"></script>
<script>
  (async function () {
    const admin = await initAdminShell('media');
    if (!admin) return;
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('adminShellRoot').style.display = 'flex';
    loadMedia();
  })();

  async function loadMedia() {
    const container = document.getElementById('mediaResult');
    try {
      const { data, error } = await adminSupabase
        .from('media')
        .select('id, file_name, alt_text, created_at')
        .order('created_at', { ascending: false });

      if (error) throw error;

      if (!data || data.length === 0) {
        container.innerHTML = renderStateBlock({
          icon: 'media',
          title: 'No media files yet',
          description: 'Uploading is coming in the next step, backed by a Supabase Storage bucket. Files you upload will appear here as a browsable grid.',
        });
        return;
      }

      const rows = data.map(function (m) {
        return '<tr><td>' + escapeHtml(m.file_name) + '</td><td>' + escapeHtml(m.alt_text || '—') + '</td><td>' + formatDate(m.created_at) + '</td></tr>';
      }).join('');

      container.innerHTML =
        '<div class="ac-table-wrap"><div class="table-scroll"><table class="ac-table">' +
        '<thead><tr><th>File name</th><th>Alt text</th><th>Uploaded</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div></div>';
    } catch (err) {
      container.innerHTML = renderErrorBanner('Could not load media: ' + (err && err.message ? err.message : 'unknown error'));
    }
  }
</script>
</body>
</html>
